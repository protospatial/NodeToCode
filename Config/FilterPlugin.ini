[FilterPlugin]
; Extra files RunUAT BuildPlugin packages with NodeToCode, on top of its defaults
; (the .uplugin, build products, /Binaries/ThirdParty, /Resources, /Content, /Shaders, /Source).
; Paths are relative to the plugin root. "..." matches any directories, "*" and "?" match
; characters, and a leading "-" excludes. Later rules win over earlier ones.

; cpp-httplib header (Source/NodeToCode.Build.cs adds it as an include path) and its MIT license.
/ThirdParty/...

; Plugin license, and this filter so the package keeps a Config directory.
/LICENSE
/Config/FilterPlugin.ini

; Developer-only files under /Content that nothing loads at runtime.
-/Content/Python/tests/...
-/Content/Scripts/...
-.../__pycache__/...
-.../*.pyc
