[FilterPlugin]
; Extra files RunUAT BuildPlugin packages with NodeToCode, on top of its defaults
; (the .uplugin, build products, /Binaries/ThirdParty, /Resources, /Content, /Shaders, /Source).
; Paths are relative to the plugin root. "..." matches any directories, "*" and "?" match
; characters, and a leading "-" excludes. Later rules win over earlier ones.

; cpp-httplib header (Source/NodeToCode.Build.cs adds it as an include path; unused since card 0113 and kept for
; card 0111, see ThirdParty/cpp-httplib/README.md) and its MIT license.
/ThirdParty/...

; Plugin license and its NOTICE (copyright and third-party notices), and this filter so the package keeps a
; Config directory.
/LICENSE
/NOTICE
/Config/FilterPlugin.ini

; Agent Skills (card 0171) for Claude Code, Codex, Copilot and other agents, and the Claude Code plugin around them
; (card 0172, Agents/claude-code: its local marketplace, .mcp.json, hook and command): users install or copy them from
; the plugin folder (wiki/developers/Agent-Skills.md, wiki/developers/Claude-Code-Plugin.md). Their sync script, and the .agents/skills mirror, stay in the
; repository.
/Agents/...
-/Agents/sync_skills.py

; Developer-only files under /Content that nothing loads at runtime.
-/Content/Python/tests/...
-/Content/Scripts/...
-.../__pycache__/...
-.../*.pyc
