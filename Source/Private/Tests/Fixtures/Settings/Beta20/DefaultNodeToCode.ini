; Config/DefaultNodeToCode.ini as a NodeToCode 2.0-beta build (settings version 4, before card 0188) saved it: the
; per-user fields (Provider, LMStudioEndpoint, McpServerPort, UIColors, CustomTranslationOutputDirectory) were still
; project settings. UIColors holds 0271's old Text Muted grey (107) beside one colour the user changed (BgPanel).
; Reference files: one inside the project, one outside it that exists on this machine, one outside it that does not.
; {Project} and {Outside} are replaced with scratch folders by NodeToCode.Settings.UserUpgrade before loading.
[/Script/NodeToCode.N2CSettings]
SettingsVersion=4
Provider=OpenAI
AnthropicModelId=claude-sonnet-5-5
OpenAIModelId=gpt-6.1-sol
LMStudioEndpoint="http://192.168.1.21:1234"
TargetLanguage=Python
TranslationDepth=2
McpServerPort=27100
McpToolExposure=ToolSearch
UIColors=(BgPanel=(B=60,G=40,R=20,A=255),TextMuted=(B=107,G=107,R=107,A=255),TextPrimary=(B=230,G=230,R=230,A=255))
CustomTranslationOutputDirectory=(Path="D:/N2CBeta/Translations")
+ReferenceSourceFilePaths=(FilePath="{Project}/Source/Beta/Public/InProject.h")
+ReferenceSourceFilePaths=(FilePath="{Outside}/Mine.h")
+ReferenceSourceFilePaths=(FilePath="{Outside}/NotOnThisMachine.h")
